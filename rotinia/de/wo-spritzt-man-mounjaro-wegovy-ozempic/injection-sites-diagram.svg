<svg xmlns="http://www.w3.org/2000/svg" xml:lang="de" lang="de" viewBox="0 0 400 386" width="400" height="386" role="img" aria-labelledby="t d">
<title id="t">Wo spritzt man Mounjaro, Wegovy und Ozempic: Diagramm der Einstichstellen</title>
<desc id="d">Wo spritzt man Mounjaro, Wegovy und Ozempic: Diagramm der Einstichstellen. Körperumriss von vorne und hinten mit Bauch, Oberschenkeln und Oberarmen markiert; bei Mounjaro und Wegovy 5 cm Abstand zum Bauchnabel; bei Mounjaro die Rückseite des Oberarms, wo eine andere Person spritzt, bei Wegovy die Vorderseite des Oberarms.</desc>
