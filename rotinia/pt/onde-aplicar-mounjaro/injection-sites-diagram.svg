.ring{fill:#efe3d6;stroke:#655a6e;stroke-width:1.1;stroke-dasharray:2.5 2}.navel{fill:#655a6e}
.lead{stroke:#b8442a;stroke-width:1.5;fill:none}.dot{fill:#b8442a}
