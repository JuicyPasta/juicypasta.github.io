<svg xmlns="http://www.w3.org/2000/svg" xml:lang="pt-BR" lang="pt-BR" viewBox="0 0 400 386" width="400" height="386" role="img" aria-labelledby="t d">
<title id="t">Onde aplicar Mounjaro: diagrama dos locais de aplicação</title>
<desc id="d">Onde aplicar Mounjaro: diagrama dos locais de aplicação. Contorno do corpo de frente e de costas com a barriga (abdome), as coxas e a parte de trás dos braços marcadas; na parte de trás do braço, quem aplica é outra pessoa.</desc>
