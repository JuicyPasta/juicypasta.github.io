<!doctype html>
<!-- Source of latecup/og.png (1200x630). Render: open at 1200x630 and screenshot (see _tools/latecup-pages/README.md). -->
<meta charset="utf-8">
<style>
html,body{margin:0}
body{width:1200px;height:630px;background:radial-gradient(900px 520px at 78% 50%,#232A3A 0%,#0E1116 70%);color:#F3EEE6;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;display:flex;align-items:center;overflow:hidden;position:relative}
.t{padding-left:84px;width:700px}
.b{display:flex;align-items:center;gap:18px;font-size:40px;font-weight:700;margin-bottom:34px}
.b img{width:76px;height:76px;border-radius:17px}
h1{font-size:74px;line-height:1.06;margin:0 0 26px;letter-spacing:-1.5px}
p{font-size:31px;line-height:1.35;color:#B4AEA3;margin:0}
.pins{position:absolute;right:0;top:0;width:470px;height:630px}
.pin{position:absolute;font-weight:700;font-size:30px;color:#1A1408;padding:8px 20px;border-radius:999px;border:3px solid #0E1116;font-variant-numeric:tabular-nums}
.a{background:#F5B14C}.o{background:#F0873A}.r{background:#F2604A}
.dot{position:absolute;width:16px;height:16px;border-radius:50%;border:3px solid #0E1116}
</style>
<body>
<div class="t">
<div class="b"><img src="../../latecup/icon.png" alt="">Latecup</div>
<h1>Coffee shops open late in NYC</h1>
<p>A map with the closing time on each pin.</p>
</div>
<div class="pins">
<span class="pin a" style="left:60px;top:96px">12 AM</span>
<span class="pin a" style="left:250px;top:170px">11</span>
<span class="pin o" style="left:120px;top:262px">10</span>
<span class="pin a" style="left:268px;top:330px">2 AM</span>
<span class="pin r" style="left:52px;top:398px">9</span>
<span class="pin a" style="left:196px;top:470px">24h</span>
<span class="dot a" style="left:200px;top:120px"></span><span class="dot o" style="left:350px;top:262px"></span><span class="dot a" style="left:70px;top:330px"></span>
<span class="dot a" style="left:380px;top:440px"></span><span class="dot r" style="left:150px;top:560px"></span><span class="dot a" style="left:330px;top:70px"></span>
</div>
</body>
