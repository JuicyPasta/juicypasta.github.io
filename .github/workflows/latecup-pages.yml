# Rebuilds Latecup's neighbourhood pages (latecup/nyc/) and the Latecup lines of sitemap.xml
# from the live feed, twice a day after the feed's own refreshes (09:17 and 15:17 UTC).
# Pages is deployed from this branch, so the commit this makes publishes by itself.
# A feed that is unreachable or fails the build's checks changes nothing: build.mjs exits 3
# before it touches a file, and this job then ends green without a commit.
name: Latecup neighbourhood pages

on:
  schedule:
    - cron: '5 10,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latecup-pages
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node _tools/latecup-pages/test.mjs
      - name: Build from the live feed
        id: build
        run: |
          set +e
          node _tools/latecup-pages/build.mjs
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "::warning::The Latecup feed was unreachable or failed a check. Nothing was changed."
            git checkout -- .
            git clean -fdq latecup
            echo "usable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          echo "usable=true" >> "$GITHUB_OUTPUT"
      - name: Commit if the pages changed
        if: steps.build.outputs.usable == 'true'
        run: |
          git add -A latecup sitemap.xml
          if git diff --cached --quiet; then
            echo "The pages already match the feed. No commit."
            exit 0
          fi
          places=$(grep -o '<!-- places: [0-9]* -->' latecup/nyc/index.html | grep -o '[0-9]*' || echo "?")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Latecup neighbourhood pages: rebuilt from the feed ($places places)"
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
          git show --stat --oneline HEAD | tail -3
